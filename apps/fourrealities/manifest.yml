modules:
  jira:projectPage:
    - key: fourrealities-project-dashboard
      title: Four Realities
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issuePanel:
    - key: fourrealities-issue-panel
      title: Four Realities
      icon: resource:icons;icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issueContext:
    - key: fourrealities-issue-context
      title: Four Realities
      label: Four Realities
      render: native
      resource: main
      resolver:
        function: resolver
  jira:adminPage:
    # ADR-011: evidence sources, decision issue types and approver groups (permission standard).
    - key: fourrealities-admin
      title: FourRealities gate authority
      render: native
      resource: admin
      resolver:
        function: admin-resolver
  scheduledTrigger:
    - key: fourrealities-daily-snapshot
      function: snapshot
      interval: day
  function:
    - key: resolver
      handler: index.handler
    - key: snapshot
      handler: index.snapshot
      timeoutSeconds: 600
    - key: admin-resolver
      handler: index.adminHandler

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: admin
    path: src/frontend/admin.tsx
  - key: icons
    path: static/icons

app:
  id: ari:cloud:ecosystem::app/974e4981-7626-4b1c-a41f-7eaccb7f3605
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - search:confluence
    - read:confluence-content.summary
    - read:jira-user
