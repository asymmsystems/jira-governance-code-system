modules:
  jira:projectPage:
    - key: fourrealities-project-dashboard
      title: Four Realities
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issuePanel:
    - key: fourrealities-issue-panel
      title: Four Realities
      icon: resource:icons;icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issueContext:
    - key: fourrealities-issue-context
      title: Four Realities
      label: Four Realities
      render: native
      resource: main
      resolver:
        function: resolver
  jira:adminPage:
    # ADR-013: evidence sources, decision issue types and approver groups (permission standard).
    - key: fourrealities-admin
      title: FourRealities gate authority
      render: native
      resource: admin
      resolver:
        function: admin-resolver
  scheduledTrigger:
    - key: fourrealities-daily-snapshot
      function: snapshot
      interval: day
    # ADR-014: the weekly personal data report and the erasure of closed accounts.
    - key: fourrealities-personal-data
      function: personal-data
      interval: week
    # ADR-015: scheduled evidence reports, retention, temporary files and stalled jobs.
    - key: fourrealities-report-daily
      function: report-daily
      interval: day
    # ADR-015: temporary people files are removed 24 to 25 hours after a download (review L-3).
    - key: fourrealities-report-tmp
      function: report-tmp
      interval: hour
  # ADR-015: evidence report files (Forge Object Store, Preview; owner decision Q5).
  objectStore:
    - key: fourrealities-reports
      storageClass: standard
  consumer:
    - key: fourrealities-report-consumer
      queue: fourrealities-report-jobs
      function: report-worker
  function:
    - key: resolver
      handler: index.handler
    - key: snapshot
      handler: index.snapshot
      timeoutSeconds: 600
    - key: admin-resolver
      handler: index.adminHandler
    - key: personal-data
      handler: index.personalData
      timeoutSeconds: 600
    - key: report-worker
      handler: index.reportWorker
      timeoutSeconds: 900
    - key: report-daily
      handler: index.reportDaily
      timeoutSeconds: 600
    - key: report-tmp
      handler: index.reportTmp
      timeoutSeconds: 600

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: admin
    path: src/frontend/admin.tsx
  - key: icons
    path: static/icons

app:
  id: ari:cloud:ecosystem::app/974e4981-7626-4b1c-a41f-7eaccb7f3605
  runtime:
    name: nodejs22.x
    # ADR-015: the assembly of a 50 MB report (spike S-3: 540 MB at the peak).
    memoryMB: 1024
  licensing:
    enabled: true

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - search:confluence
    - read:confluence-content.summary
    - read:jira-user
    - report:personal-data
