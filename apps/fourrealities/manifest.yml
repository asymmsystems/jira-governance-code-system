modules:
  jira:projectPage:
    - key: fourrealities-project-dashboard
      title: FourRealities Audit Dashboard
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issuePanel:
    - key: fourrealities-issue-panel
      title: Reality Alignment
      icon: resource:icons;icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issueContext:
    - key: fourrealities-issue-context
      title: Delivery Integrity
      label: Delivery Integrity
      render: native
      resource: main
      resolver:
        function: resolver
  scheduledTrigger:
    - key: fourrealities-daily-snapshot
      function: snapshot
      interval: day
  function:
    - key: resolver
      handler: index.handler
    - key: snapshot
      handler: index.snapshot
      timeoutSeconds: 600

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: icons
    path: static/icons

app:
  id: ari:cloud:ecosystem::app/974e4981-7626-4b1c-a41f-7eaccb7f3605
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
