modules:
  jira:projectPage:
    - key: fourrealities-project-dashboard
      title: Four Realities
      render: native
      resource: main
      resolver:
        function: resolver
  jira:globalPage:
    - key: fourrealities-spike
      title: FR spike
      render: native
      resource: spike
      resolver:
        function: spike-resolver
  jira:issuePanel:
    - key: fourrealities-issue-panel
      title: Four Realities
      icon: resource:icons;icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issueContext:
    - key: fourrealities-issue-context
      title: Four Realities
      label: Four Realities
      render: native
      resource: main
      resolver:
        function: resolver
  jira:adminPage:
    # ADR-013: evidence sources, decision issue types and approver groups (permission standard).
    - key: fourrealities-admin
      title: FourRealities gate authority
      render: native
      resource: admin
      resolver:
        function: admin-resolver
  scheduledTrigger:
    - key: fourrealities-daily-snapshot
      function: snapshot
      interval: day
    # ADR-014: the weekly personal data report and the erasure of closed accounts.
    - key: fourrealities-personal-data
      function: personal-data
      interval: week
  objectStore:
    - key: fr-reports
      storageClass: standard
  webtrigger:
    - key: fourrealities-spike-web
      function: spike-web
      response:
        type: dynamic
  consumer:
    - key: fourrealities-report-consumer
      queue: fourrealities-report-jobs
      function: report-worker
  function:
    - key: spike-resolver
      handler: spike.handler
    - key: spike-web
      handler: spike.web
    - key: report-worker
      handler: spike.worker
      timeoutSeconds: 900
    - key: resolver
      handler: index.handler
    - key: snapshot
      handler: index.snapshot
      timeoutSeconds: 600
    - key: admin-resolver
      handler: index.adminHandler
    - key: personal-data
      handler: index.personalData
      timeoutSeconds: 600

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: admin
    path: src/frontend/admin.tsx
  - key: spike
    path: src/frontend/spike.tsx
  - key: icons
    path: static/icons

app:
  id: ari:cloud:ecosystem::app/974e4981-7626-4b1c-a41f-7eaccb7f3605
  runtime:
    name: nodejs22.x
    memoryMB: 1024
  licensing:
    enabled: true

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - search:confluence
    - read:confluence-content.summary
    - read:jira-user
    - report:personal-data
