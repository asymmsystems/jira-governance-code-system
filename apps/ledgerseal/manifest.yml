modules:
  jira:issuePanel:
    - key: ledgerseal-panel
      title: Approval Seal
      tooltip: LedgerSeal approval seal
      icon: resource:icons;icon.svg
      render: native
      resource: main
      resolver:
        function: resolver
  jira:issueContext:
    # F-12: always visible in the issue's details column; shows the seal state without opening the panel.
    - key: ledgerseal-context
      title: LedgerSeal
      label: Approval seal
      icon: resource:icons;icon.svg
      render: native
      resource: context
      resolver:
        function: resolver
  jira:adminPage:
    - key: ledgerseal-admin
      title: LedgerSeal settings
      render: native
      resource: admin
      resolver:
        function: resolver
  jira:customField:
    # ADR-018: sign on the transition screen. No `experience` limit: the manifest schema has no
    # issue-transition value, and spike S-1 showed the field on the new transition dialog without one.
    # No `view` either: with a view resource, the new transition dialog showed Jira's plain text box
    # instead of this edit view (live, LSP-6, 2026-11-08), so the issue view shows the intent id.
    - key: ledgerseal-signature
      name: LedgerSeal signature
      description: Sign with LedgerSeal on a transition screen. The value is a single-use signing intent id, never a code.
      type: string
      edit:
        resource: sigedit
        render: native
      resolver:
        function: resolver
  jira:issueAction:
    # ADR-018 decision 1, option B: sign from the issue's actions menu wherever the field is not on the screen.
    - key: ledgerseal-sign-action
      title: Sign with LedgerSeal
      render: native
      resource: main
      resolver:
        function: resolver
  jira:workflowValidator:
    - key: ledgerseal-validator
      name: Require Valid LedgerSeal
      description: Blocks the transition unless the issue is sealed and unchanged since approval.
      function: validate-transition
  jira:entityProperty:
    - key: ledgerseal-cert-index
      entityType: issue
      propertyKey: ledgerseal-cert
      values:
        - path: status
          type: string
          searchAlias: ledgersealStatus
        - path: everCompromised
          type: string
          searchAlias: ledgersealEverCompromised
        - path: incidentCount
          type: number
          searchAlias: ledgersealIncidents
        # ADR-017: issues waiting for approval (schema 4 only)
        - path: approval.runState
          type: string
          searchAlias: ledgersealApproval
  trigger:
    - key: ledgerseal-issue-changed
      function: on-issue-changed
      events:
        - avi:jira:updated:issue
        - avi:jira:commented:issue
        - avi:jira:created:attachment
        - avi:jira:deleted:attachment
        - avi:jira:created:worklog
        - avi:jira:updated:worklog
        - avi:jira:deleted:worklog
    - key: ledgerseal-issue-deleted
      function: on-issue-deleted
      events:
        - avi:jira:deleted:issue
  scheduledTrigger:
    # ADR-011 decision 5: the weekly personal data report; closed accounts are erased from the party map.
    - key: ledgerseal-personal-data-report
      function: personal-data-report
      interval: week
  function:
    - key: resolver
      handler: index.handler
    - key: validate-transition
      handler: index.validateTransition
    - key: on-issue-changed
      handler: index.onIssueChanged
    - key: on-issue-deleted
      handler: index.onIssueDeleted
    - key: personal-data-report
      handler: index.personalDataReport
      timeoutSeconds: 300

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: admin
    path: src/frontend/admin.tsx
  - key: context
    path: src/frontend/context.tsx
  - key: icons
    path: static/icons
  - key: sigedit
    path: src/frontend/signature-field.tsx

app:
  id: ari:cloud:ecosystem::app/7489a645-7c96-400a-b289-eb36f2701a00
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true

permissions:
  scopes:
    - read:jira-work
    - write:issue.property:jira
    - read:jira-user
    - storage:app
    - report:personal-data
    - send:notification:jira
