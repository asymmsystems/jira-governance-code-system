modules:
  jira:issuePanel:
    - key: definitionguard-issue-panel
      title: Definition of Done
      tooltip: Definition of Done Checklist
      icon: resource:icons;check.svg
      render: native
      resource: main
      resolver:
        function: resolver
  jira:projectSettingsPage:
    - key: definitionguard-project-settings
      title: DefinitionGuard
      render: native
      resource: settings
      resolver:
        function: settings-resolver
  jira:adminPage:
    - key: definitionguard-admin
      title: DefinitionGuard approvers
      render: native
      resource: admin
      resolver:
        function: admin-resolver
  jira:workflowValidator:
    - key: definitionguard-workflow-validator
      name: DefinitionGuard DoD Enforcement
      description: Blocks workflow transitions when mandatory Definition of Done checklist items remain incomplete
      function: validateTransition
      projectTypes: ['company-managed', 'team-managed']
  scheduledTrigger:
    # ADR-010: the weekly personal data report, erasure of closed accounts, and the one-time
    # pseudonym pass over records written before 6.0.0.
    - key: personal-data-report
      function: personal-data-fn
      interval: week
  function:
    - key: resolver
      handler: index.handler
    - key: validateTransition
      handler: index.validateTransition
    - key: settings-resolver
      handler: index.settingsHandler
    - key: admin-resolver
      handler: index.adminHandler
    - key: personal-data-fn
      handler: index.personalDataTrigger

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: settings
    path: src/frontend/settings.tsx
  - key: admin
    path: src/frontend/admin.tsx
  - key: icons
    path: static/icons

app:
  id: ari:cloud:ecosystem::app/73e4f63d-7d60-450c-96d5-f81ca68a709c
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
    - read:workflow:jira
    - report:personal-data
