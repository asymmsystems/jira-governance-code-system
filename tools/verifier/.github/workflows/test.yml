#
# Runs the self-test and the tests of the LedgerSeal open verifier on Node.js 18, 20 and 22.
#
# @author Fahim Farook

name: Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Self-Test
        run: node verify-evidence.mjs --self-test

      - name: Run Test Suite
        run: node --test test/verify.test.mjs
