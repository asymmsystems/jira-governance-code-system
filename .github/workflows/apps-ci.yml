#
# Clean-clone build of every Forge app (ADR-007): install the shared UI package first, then the
# app, then type-check, test and lint. CascadePlan also rebuilds its UI bundle and fails when the
# committed bundle differs.
name: Apps CI

on:
  push:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/apps-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/apps-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        app: [cascadeplan, definitionguard, ledgerseal, fourrealities]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the shared UI package (builds dist through prepare)
        working-directory: packages/asymm-jira-ui
        run: npm ci --no-audit --no-fund

      - name: Install the app
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci --no-audit --no-fund
          test -f node_modules/@asymm/jira-ui/dist/index.js

      - name: Install the UI bundler
        if: matrix.app == 'cascadeplan'
        working-directory: apps/cascadeplan/tools
        run: npm ci --no-audit --no-fund

      # Marketplace security requirement 11: no known critical or high vulnerabilities in the
      # production dependencies (MK-02, security questionnaire Q10).
      - name: Dependency audit (production, high and critical)
        # Each app joins this list when its dependency fixes are on master.
        if: contains(fromJSON('["cascadeplan", "definitionguard", "ledgerseal"]'), matrix.app)
        working-directory: apps/${{ matrix.app }}
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        working-directory: apps/${{ matrix.app }}
        run: npx --no-install tsc --noEmit

      - name: Tests with coverage thresholds
        working-directory: apps/${{ matrix.app }}
        run: npm test

      - name: Rebuild the UI bundle and compare with the committed one
        if: matrix.app == 'cascadeplan'
        working-directory: apps/cascadeplan
        run: |
          npm run build
          git diff --exit-code -- static/frontend/build

      # forge lint needs a Forge login. It runs when the repository has the secrets FORGE_EMAIL and
      # FORGE_API_TOKEN (an Atlassian API token of the app owner); without them the step is skipped.
      - name: Forge lint
        if: env.FORGE_API_TOKEN != ''
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        working-directory: apps/${{ matrix.app }}
        run: |
          # CI has no terminal for the CLI's first-run analytics question, so answer it first.
          npx --yes @forge/cli@15.0.0 settings set usage-analytics false
          # forge lint also exits 1 on "approval" notices, for example a scope change that makes the
          # next deploy a major version. Those are deploy decisions, not code faults: the step fails
          # only on errors or warnings.
          set +e
          out=$(npx --yes @forge/cli@15.0.0 lint 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qE '\(0 errors, 0 warnings, [0-9]+ approvals?\)'; then
              echo "Only approval notices: not a lint failure."
            else
              exit $code
            fi
          fi
